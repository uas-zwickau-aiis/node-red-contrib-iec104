<script type="text/javascript">
RED.nodes.registerType('iec104-slaveobserver',{
  category: 'IEC 104',
  color: '#dce5f5',
  defaults: {
    name: { value: "" },
    connection: { type: "iec104-slave", required: true }
  },
  inputs: 0,
  outputs: 2,
  outputLabels: [
    "Data",
    "Status"
  ],
  icon: "font-awesome/fa-eye",
  paletteLabel: function() {
        return this._("iec104.paletteLabel");
  },
  label: function () {
    if (this.name) return this.name;

    const gwNode = RED.nodes.node(this.connection);
    const baseLabel = this._("iec104.label");

    if (gwNode && gwNode.name) {
        return `${baseLabel} [${gwNode.name}]`;
    }

    return `${baseLabel}`;
  }
});
</script>

<script type="text/html" data-template-name="iec104-slaveobserver">

  <div class="form-row">
    <label for="node-input-name">Name</label>
    <input type="text" id="node-input-name">
  </div>

  <div class="form-row">
    <label for="node-input-connection">IEC 60870-5-104 Slave</label>
    <input type="text" id="node-input-connection">
  </div>

</script>
