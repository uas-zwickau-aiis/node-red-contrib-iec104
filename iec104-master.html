<script type="text/javascript">
RED.nodes.registerType('iec104-master',{
  category: 'config',
  defaults: {
    name: {value: ''},
    host: {value: '127.0.0.1', required: true},
    port: {value: 2404, required: true, validate: RED.validators.number()},
    autoGI: {value: true},
    gi_ca: {value: 65535, required: true, validate: RED.validators.number()},
    t1: { value: 15, required: true, validate: RED.validators.number()},
    t3: { value: 20, required: true, validate: RED.validators.number()},
    k_win: { value: 12, required: true, validate: RED.validators.number()},
    w_win: { value: 8, required: true, validate: RED.validators.number()}
  },
  label: function() {
    return this.name || "IEC 60870-5-104 Master";
  },
  paletteLabel: "IEC 60870-5-104 Master",

  oneditprepare: function () {
    const nodeId = this.id;
    let es = null;

    const colors = {
      IDLE: "#666",
      CONNECTED: "#d98c00",
      DATA_TRANSFER: "green",
      STOPPING: "#d98c00",
      STOPPED: "#1d6fd1",
      DISCONNECTED: "red",
      UNKNOWN: "#999"
    };

    function fmtTs(ts) {
      if (!ts) return "-";
      return new Date(ts).toLocaleTimeString();
    }

    function yesNo(v) {
      return v ? "yes" : "no";
    }

    function renderStatus(data) {
      const state = data?.state || "UNKNOWN";
      const reason = data?.reason || "";
      const color = colors[state] || colors.UNKNOWN;

      $("#node-config-status").text(state).css("color", color);
      $("#node-config-reason").text(reason);

      const session = data?.session;
      const a = session?.apci;
      const stats = session?.stats;
      const timers = session?.timers;
      const gi = session?.gi;

      if (a) {
        $("#node-config-apci-sendseq").text(a.sendSeq);
        $("#node-config-apci-recvseq").text(a.recvSeq);
        $("#node-config-apci-ackseq").text(a.ackSeq);
        $("#node-config-apci-window").text(`${a.unconfirmed}/${a.k}`);
        $("#node-config-apci-ackpending").text(`${a.recvSinceLastAck}/${a.w}`);
        $("#node-config-cansend")
          .text(yesNo(a.hasSendWindow))
          .css("color", a.hasSendWindow ? "green" : "red");
      } else {
        $("#node-config-apci-sendseq").text("-");
        $("#node-config-apci-recvseq").text("-");
        $("#node-config-apci-ackseq").text("-");
        $("#node-config-apci-window").text("-");
        $("#node-config-apci-ackpending").text("-");
        $("#node-config-cansend").text("-").css("color", "#666");
      }

      if (stats) {
        $("#node-config-frame-itx").text(stats.iTx ?? "-");
        $("#node-config-frame-irx").text(stats.iRx ?? "-");
        $("#node-config-frame-stx").text(stats.sTx ?? "-");
        $("#node-config-frame-srx").text(stats.sRx ?? "-");
        $("#node-config-frame-utx").text(stats.uTx ?? "-");
        $("#node-config-frame-urx").text(stats.uRx ?? "-");

        $("#node-config-gi-count").text(stats.giCount ?? "-");
        $("#node-config-gi-actcon").text(stats.giActConReceived ?? "-");
        $("#node-config-gi-actterm").text(stats.giActTermReceived ?? "-");
        $("#node-config-points-received").text(stats.pointsReceived ?? "-");

        $("#node-config-t1-timeouts").text(stats.t1Timeouts ?? "-");
        $("#node-config-t3-timeouts").text(stats.t3Timeouts ?? "-");
        $("#node-config-last-rx").text(fmtTs(stats.lastRxAt));
        $("#node-config-last-tx").text(fmtTs(stats.lastTxAt));
        $("#node-config-last-frame").text(stats.lastFrameType || "-");
        $("#node-config-connected-since").text(fmtTs(stats.connectionStartedAt));
        $("#node-config-testfr-act-sent").text(stats.testFrActSent ?? "-");
        $("#node-config-testfr-con-received").text(stats.testFrConReceived ?? "-");
      } else {
        $("#node-config-frame-itx").text("-");
        $("#node-config-frame-irx").text("-");
        $("#node-config-frame-stx").text("-");
        $("#node-config-frame-srx").text("-");
        $("#node-config-frame-utx").text("-");
        $("#node-config-frame-urx").text("-");

        $("#node-config-gi-count").text("-");
        $("#node-config-gi-actcon").text("-");
        $("#node-config-gi-actterm").text("-");
        $("#node-config-points-received").text("-");

        $("#node-config-t1-timeouts").text("-");
        $("#node-config-t3-timeouts").text("-");
        $("#node-config-last-rx").text("-");
        $("#node-config-last-tx").text("-");
        $("#node-config-last-frame").text("-");
        $("#node-config-connected-since").text("-");
        $("#node-config-testfr-act-sent").text("-");
        $("#node-config-testfr-con-received").text("-");
      }

      if (timers) {
        $("#node-config-await-startcon").text(yesNo(timers.awaitingStartCon));
        $("#node-config-await-testcon").text(yesNo(timers.awaitingTestCon));
      } else {
        $("#node-config-await-startcon").text("-");
        $("#node-config-await-testcon").text("-");
      }

      if (gi) {
        $("#node-config-gi-active").text(yesNo(gi.active));
        $("#node-config-gi-cas").text((gi.cas && gi.cas.length) ? gi.cas.join(", ") : "-");
      } else {
        $("#node-config-gi-active").text("-");
        $("#node-config-gi-cas").text("-");
      }
    }

    $.getJSON("iec104/" + nodeId + "/status")
      .done(renderStatus)
      .fail(function () {
        renderStatus({ state: "UNKNOWN", reason: "keine Verbindung", session: null });
      });

    es = new EventSource("iec104/" + nodeId + "/events");

    es.addEventListener("status", function (evt) {
      try {
        renderStatus(JSON.parse(evt.data));
      } catch (err) {
        console.warn("IEC104 status parse error", err);
      }
    });

    es.onerror = function () {
      renderStatus({
        state: "DISCONNECTED",
        reason: "Status-Stream getrennt",
        session: null
      });
    };

    this._iec104EventSource = es;
  },

  oneditcancel: function () {
    if (this._iec104EventSource) {
      this._iec104EventSource.close();
      this._iec104EventSource = null;
    }
  },

  oneditsave: function () {
    if (this._iec104EventSource) {
      this._iec104EventSource.close();
      this._iec104EventSource = null;
    }
  }
});
</script>

<script type="text/html" data-template-name="iec104-master">

  <div class="form-row">
    <label for="node-config-input-name">Name</label>
    <input type="text" id="node-config-input-name">
  </div>

  <div class="form-row">
    <label for="node-config-input-host">Host</label>
    <input type="text" id="node-config-input-host" placeholder="127.0.0.1">

    <label for="node-config-input-port">Port</label>
    <input type="number" id="node-config-input-port">

  <div class="form-row">
    <label for="node-config-input-autoGI">Auto GI</label>

  </div>

  <div class="form-row">
    <label for="node-config-input-gi_ca">GI CA</label>

    <span style="margin-left:6px;">65535 = Broadcast</span>

  <div class="form-row">
    <label>k/w</label>
    <input type="number" id="node-config-input-k_win" placeholder="k" style="width:80px; margin-right:5px;">

  <div class="form-row"><label>Status</label><span id="node-config-status" style="font-weight:bold;">UNKNOWN</span></div>

  <div class="form-row"><label>RecvSeq</label><span id="node-config-apci-recvseq">-</span></div>
  <div class="form-row"><label>AckSeq</label><span id="node-config-apci-ackseq">-</span></div>
  <div class="form-row"><label>Send Window</label><span id="node-config-apci-window">-</span></div>
  <div class="form-row"><label>Ack Pending</label><span id="node-config-apci-ackpending">-</span></div>
  <div class="form-row"><label>Can Send</label><span id="node-config-cansend">-</span></div>

  <hr>

  <div class="form-row"><label>I TX</label><span id="node-config-frame-itx">-</span></div>
  <div class="form-row"><label>I RX</label><span id="node-config-frame-irx">-</span></div>
  <div class="form-row"><label>S TX</label><span id="node-config-frame-stx">-</span></div>
  <div class="form-row"><label>S RX</label><span id="node-config-frame-srx">-</span></div>
  <div class="form-row"><label>U TX</label><span id="node-config-frame-utx">-</span></div>
  <div class="form-row"><label>U RX</label><span id="node-config-frame-urx">-</span></div>

  <hr>

  <div class="form-row"><label>GI Count</label><span id="node-config-gi-count">-</span></div>
  <div class="form-row"><label>GI Active</label><span id="node-config-gi-active">-</span></div>
  <div class="form-row"><label>GI CAs</label><span id="node-config-gi-cas">-</span></div>
  <div class="form-row"><label>GI ACTCON RX</label><span id="node-config-gi-actcon">-</span></div>
  <div class="form-row"><label>GI ACTTERM RX</label><span id="node-config-gi-actterm">-</span></div>
  <div class="form-row"><label>Points RX</label><span id="node-config-points-received">-</span></div>

  <hr>

  <div class="form-row"><label>Await STARTCON</label><span id="node-config-await-startcon">-</span></div>
  <div class="form-row"><label>Await TESTCON</label><span id="node-config-await-testcon">-</span></div>
  <div class="form-row"><label>T1 Timeouts</label><span id="node-config-t1-timeouts">-</span></div>
  <div class="form-row"><label>T3 Timeouts</label><span id="node-config-t3-timeouts">-</span></div>
  <div class="form-row"><label>TESTFR ACT TX</label><span id="node-config-testfr-act-sent">-</span></div>
  <div class="form-row"><label>TESTFR CON RX</label><span id="node-config-testfr-con-received">-</span></div>

  <hr>

  <div class="form-row"><label>Connected Since</label><span id="node-config-connected-since">-</span></div>
  <div class="form-row"><label>Last RX</label><span id="node-config-last-rx">-</span></div>
  <div class="form-row"><label>Last TX</label><span id="node-config-last-tx">-</span></div>
  <div class="form-row"><label>Last Frame</label><span id="node-config-last-frame">-</span></div>

</script>
