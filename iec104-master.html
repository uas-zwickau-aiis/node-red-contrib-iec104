<script type="text/javascript">
RED.nodes.registerType('iec104-master',{
  category: 'config',
  defaults: {
    name: {value: ''},
    host: {value: '127.0.0.1', required: true},
    port: {value: 2404, required: true, validate: RED.validators.number()},
    autoGI: {value: true},
    gi_ca: {value: 65535, required: true, validate: RED.validators.number()},
    t0: { value: 30, required: true, validate: RED.validators.number()},
    t1: { value: 15, required: true, validate: RED.validators.number()},
    t2: { value: 10, required: true, validate: RED.validators.number()},
    t3: { value: 20, required: true, validate: RED.validators.number()},
    k_win: { value: 12, required: true, validate: RED.validators.number()},
    w_win: { value: 8, required: true, validate: RED.validators.number()},
    reconnectDelay: { value: 5, required: true, validate: RED.validators.number()},
    maxRetries: { value: 10, required: true, validate: RED.validators.number()},

    benchmark_outbound: {value: false},
    benchmark_inbound_report: {value: false},

    benchmark_measurement_duration: {
      value: 60,
      required: true,
      validate: RED.validators.number()
    }
  },
  label: function() {
    return this.name || "IEC 60870-5-104 Master";
  },
  paletteLabel: "IEC 60870-5-104 Master",

  oneditprepare: function () {
    const nodeId = this.id;
    const _ = this._.bind(this);
    let es = null;

    const tabs = RED.tabs.create({
      id: "node-config-iec104-tabs",
      onchange: function(tab) {
        const $settingsTab = $("#node-config-tab-settings");
        const $diagnosticsTab = $("#node-config-tab-diagnostics");
        const $benchmarkTab = $("#node-config-tab-benchmark");
        const $infoBox = $("#node-config-iec104-info");

        $settingsTab.hide();
        $diagnosticsTab.hide();
        $benchmarkTab.hide();
        $infoBox.find(".iec104-help-text").empty();

        if (tab.id === "node-config-tab-settings") {
          $settingsTab.css("display", "flex");
          $infoBox.show();
        } else if (tab.id === "node-config-tab-diagnostics") {
          $diagnosticsTab.show();
          $infoBox.hide();
        } else if (tab.id === "node-config-tab-benchmark") {
          $benchmarkTab.show();
          $infoBox.hide();
        }
      }
    });

    tabs.addTab({
      id: "node-config-tab-settings",
      label: this._("iec104.settings.tab-name")
    });

    tabs.addTab({
      id: "node-config-tab-diagnostics",
      label: this._("iec104.diag.tab-name")
    });

    tabs.addTab({
      id: "node-config-tab-benchmark",
      label: "Benchmark"
    });

    $("#node-config-iec104-tabs-content").children().hide();
    $("#node-config-tab-settings").css("display", "flex");

    const colors = {
      IDLE: "#666",
      CONNECTED: "#d98c00",
      DATA_TRANSFER: "green",
      STOPPING: "#d98c00",
      STOPPED: "#1d6fd1",
      DISCONNECTED: "red",
      UNKNOWN: "#999"
    };

    function fmtTs(ts) {
      if (!ts) return "-";
      return new Date(ts).toLocaleTimeString();
    }

    function yesNo(v) {
      return v ? "yes" : "no";
    }

    function renderStatus(data) {
      const state = data?.state || "UNKNOWN";
      const raw = data?.reason || "";
      const translated = _(raw);
      const color = colors[state] || colors.UNKNOWN;

      $("#node-config-status").text(state).css("color", color);
      $("#node-config-reason").text(translated === raw ? raw : translated);

      const session = data?.session;
      const a = session?.apci;
      const stats = session?.stats;
      const timers = session?.timers;
      const gi = session?.gi;

      if (a) {
        $("#node-config-apci-sendseq").text(a.sendSeq);
        $("#node-config-apci-recvseq").text(a.recvSeq);
        $("#node-config-apci-ackseq").text(a.ackSeq);
        $("#node-config-apci-window").text(`${a.unconfirmed}/${a.k}`);
        $("#node-config-apci-ackpending").text(`${a.recvSinceLastAck}/${a.w}`);
        $("#node-config-cansend")
          .text(yesNo(a.hasSendWindow))
          .css("color", a.hasSendWindow ? "green" : "red");
      } else {
        $("#node-config-apci-sendseq").text("-");
        $("#node-config-apci-recvseq").text("-");
        $("#node-config-apci-ackseq").text("-");
        $("#node-config-apci-window").text("-");
        $("#node-config-apci-ackpending").text("-");
        $("#node-config-cansend").text("-").css("color", "#666");
      }

      if (stats) {
        $("#node-config-frame-itx").text(stats.iTx ?? "-");
        $("#node-config-frame-irx").text(stats.iRx ?? "-");
        $("#node-config-frame-stx").text(stats.sTx ?? "-");
        $("#node-config-frame-srx").text(stats.sRx ?? "-");
        $("#node-config-frame-utx").text(stats.uTx ?? "-");
        $("#node-config-frame-urx").text(stats.uRx ?? "-");

        $("#node-config-gi-count").text(stats.giCount ?? "-");
        $("#node-config-gi-actcon").text(stats.giActConReceived ?? "-");
        $("#node-config-gi-actterm").text(stats.giActTermReceived ?? "-");
        $("#node-config-points-received").text(stats.pointsReceived ?? "-");

        $("#node-config-last-rx").text(fmtTs(stats.lastRxAt));
        $("#node-config-last-tx").text(fmtTs(stats.lastTxAt));
        $("#node-config-last-frame").text(stats.lastFrameType || "-");
        $("#node-config-connected-since").text(fmtTs(stats.connectionStartedAt));
        $("#node-config-testfr-act-sent").text(stats.testFrActSent ?? "-");
        $("#node-config-testfr-con-received").text(stats.testFrConReceived ?? "-");
      } else {
        $("#node-config-frame-itx").text("-");
        $("#node-config-frame-irx").text("-");
        $("#node-config-frame-stx").text("-");
        $("#node-config-frame-srx").text("-");
        $("#node-config-frame-utx").text("-");
        $("#node-config-frame-urx").text("-");

        $("#node-config-gi-count").text("-");
        $("#node-config-gi-actcon").text("-");
        $("#node-config-gi-actterm").text("-");
        $("#node-config-points-received").text("-");

        $("#node-config-t1-timeouts").text("-");
        $("#node-config-t3-timeouts").text("-");
        $("#node-config-last-rx").text("-");
        $("#node-config-last-tx").text("-");
        $("#node-config-last-frame").text("-");
        $("#node-config-connected-since").text("-");
        $("#node-config-testfr-act-sent").text("-");
        $("#node-config-testfr-con-received").text("-");
      }

      if (timers) {
        $("#node-config-await-startcon").text(yesNo(timers.awaitingStartCon));
        $("#node-config-await-testcon").text(yesNo(timers.awaitingTestCon));
      } else {
        $("#node-config-await-startcon").text("-");
        $("#node-config-await-testcon").text("-");
      }

      if (gi) {
        $("#node-config-gi-active").text(yesNo(gi.active));
        $("#node-config-gi-cas").text((gi.cas && gi.cas.length) ? gi.cas.join(", ") : "-");
      } else {
        $("#node-config-gi-active").text("-");
        $("#node-config-gi-cas").text("-");
      }
    }

    $.getJSON("iec104/" + nodeId + "/status")
      .done(renderStatus)
      .fail(function () {
        renderStatus({ state: "UNKNOWN", reason: "keine Verbindung", session: null });
      });

    es = new EventSource("iec104/" + nodeId + "/events");

    es.addEventListener("status", function (evt) {
      try {
        renderStatus(JSON.parse(evt.data));
      } catch (err) {
        console.warn("IEC104 status parse error", err);
      }
    });

    es.onerror = function () {
      renderStatus({
        state: "DISCONNECTED",
        reason: "Status-Stream getrennt",
        session: null
      });
    };

    // ==========================================
    // Benchmark control
    // ==========================================

    let benchmarkStatusTimer = null;

    function formatDuration(ms) {
      if (ms === null || ms === undefined) {
        return "-";
      }

      return (ms / 1000).toFixed(1) + " s";
    }

    function renderBenchmarkStatus(data) {
      const phase = data?.phase || "idle";

      const labels = {
        idle: "Bereit",
        warmup: "Aufwärmphase",
        measurement: "Messung",
        finished: "Abgeschlossen"
      };

      $("#node-config-benchmark-phase")
        .text(labels[phase] || phase);

      if (phase === "warmup") {
        $("#node-config-benchmark-progress")
          .text(
            "Warm-up: " +
            formatDuration(data?.warmup?.elapsedMs)
          );
      } else if (phase === "measurement") {
        const elapsed =
          data?.measurement?.elapsedMs ?? 0;

        const duration =
          data?.measurement?.configuredDurationMs ?? 0;

        $("#node-config-benchmark-progress")
          .text(
            "Messung: " +
            formatDuration(elapsed) +
            " / " +
            formatDuration(duration)
          );
      } else if (phase === "finished") {
        $("#node-config-benchmark-progress")
          .text(
            "Messdauer: " +
            formatDuration(
              data?.measurement?.elapsedMs
            )
          );
      } else {
        $("#node-config-benchmark-progress")
          .text("-");
      }

      const running =
        phase === "warmup" ||
        phase === "measurement";

      $("#node-config-benchmark-start")
        .prop("disabled", running)
        .text(
          phase === "finished"
            ? "Neuen Benchmark starten"
            : "Benchmark starten"
        );
    }

    function refreshBenchmarkStatus() {
      $.getJSON(
        "iec104/" +
        nodeId +
        "/benchmark/status"
      )
        .done(renderBenchmarkStatus)
        .fail(function() {
          renderBenchmarkStatus({
            phase: "idle"
          });
        });
    }

    $("#node-config-benchmark-start")
      .on("click", function(evt) {
        evt.preventDefault();

        const $button = $(this);
        $button.prop("disabled", true);

        $.ajax({
          url:
            "iec104/" +
            nodeId +
            "/benchmark/start",
          method: "POST",
          dataType: "json"
        })
          .done(function(data) {
            renderBenchmarkStatus(data);
          })
          .fail(function(xhr) {
            const message =
              xhr.responseJSON?.error ||
              "Benchmark konnte nicht gestartet werden.";

            RED.notify(
              message,
              "error"
            );

            refreshBenchmarkStatus();
          });
      });

    refreshBenchmarkStatus();

    benchmarkStatusTimer = setInterval(
      refreshBenchmarkStatus,
      1000
    );


    const $infoBox = $("#node-config-iec104-info");
    const $editorLayout = $(".iec104-editor-layout");
    const resizeNamespace = ".iec104Master-" + nodeId;

    function resizeEditorLayout() {
      const $tray = $editorLayout.closest(".red-ui-tray");
      if (!$tray.length || !$editorLayout.length) return;

      const $footer = $tray.find(".red-ui-tray-footer").first();
      const layoutTop = $editorLayout.offset().top;
      let availableBottom = $tray.offset().top + $tray.innerHeight();

      if ($footer.length && $footer.is(":visible")) {
        availableBottom = $footer.offset().top;
      }

      $editorLayout.height(Math.max(280, availableBottom - layoutTop - 8));
    }

    function showParameterInfo(element) {
      const text = $(element).attr("data-info") || "";
      const $helpText = $infoBox.find(".iec104-help-text");
      const availableWidth = Math.max(0, Math.floor($infoBox.innerWidth() - 12));

      $helpText
        .empty()
        .css({
          display: "block",
          width: availableWidth + "px",
          maxWidth: availableWidth + "px",
          minWidth: "0",
          whiteSpace: "normal",
          overflowWrap: "anywhere",
          wordBreak: "break-word"
        })
        .text(text);
    }

    function clearParameterInfo() {
      $infoBox.find(".iec104-help-text").empty();
    }

    $(window)
      .off("resize" + resizeNamespace)
      .on("resize" + resizeNamespace, resizeEditorLayout);

    setTimeout(resizeEditorLayout, 0);
    setTimeout(resizeEditorLayout, 150);

    $(".iec104-help-label")
      .on("mouseenter focus", function () {
        showParameterInfo(this);
      })
      .on("mouseleave blur", function () {
        clearParameterInfo();
      });

    this._iec104ResizeNamespace = resizeNamespace;
    this._iec104EventSource = es;
    this._iec104BenchmarkStatusTimer =
      benchmarkStatusTimer;
  },

  oneditcancel: function () {
    if (this._iec104ResizeNamespace) {
      $(window).off("resize" + this._iec104ResizeNamespace);
      this._iec104ResizeNamespace = null;
    }
    if (this._iec104BenchmarkStatusTimer) {
      clearInterval(
        this._iec104BenchmarkStatusTimer
      );
      this._iec104BenchmarkStatusTimer = null;
    }

    if (this._iec104EventSource) {
      this._iec104EventSource.close();
      this._iec104EventSource = null;
    }
  },

  oneditsave: function () {
    if (this._iec104ResizeNamespace) {
      $(window).off("resize" + this._iec104ResizeNamespace);
      this._iec104ResizeNamespace = null;
    }
    if (this._iec104BenchmarkStatusTimer) {
      clearInterval(
        this._iec104BenchmarkStatusTimer
      );
      this._iec104BenchmarkStatusTimer = null;
    }

    if (this._iec104EventSource) {
      this._iec104EventSource.close();
      this._iec104EventSource = null;
    }
  }
});
</script>

<script type="text/html" data-template-name="iec104-master">
  <style>
    .iec104-diag-table { width:80%; border-collapse:collapse; }
    .iec104-diag-table td { padding:4px 0; vertical-align:top; }
    .iec104-diag-table td:first-child { width:240px; padding-right:24px; }
    .iec104-diag-table td:last-child { text-align:left; white-space:nowrap; }
    .iec104-diag-table.iec104-diag-values-right td:last-child { text-align:right; }
    .iec104-diag-frame-table th, .iec104-diag-frame-table td { padding:4px 0; }
    .iec104-diag-frame-table th:first-child, .iec104-diag-frame-table td:first-child { text-align:left; }
    .iec104-diag-frame-table th:nth-child(2), .iec104-diag-frame-table td:nth-child(2) { width:70px; padding-right:24px; text-align:right; }
    .iec104-diag-frame-table th:nth-child(3), .iec104-diag-frame-table td:nth-child(3) { width:70px; text-align:right; }

    .iec104-help-label { cursor:help; user-select:none; }
    .iec104-help-label:focus { outline:1px dotted currentColor; outline-offset:2px; }

    .iec104-editor-layout {
      display:flex;
      flex-direction:column;
      min-height:280px;
      box-sizing:border-box;
      overflow:hidden;
    }

    .iec104-tabs-header { flex:0 0 auto; }

    #node-config-iec104-tabs-content {
      flex:1 1 auto;
      min-height:0;
      overflow:hidden;
    }

    #node-config-tab-settings {
      height:100%;
      min-height:0;
      flex-direction:column;
      overflow:hidden;
    }

    .iec104-settings-scroll {
      flex:1 1 auto;
      min-height:0;
      overflow-y:auto;
      overflow-x:hidden;
      padding-right:8px;
      box-sizing:border-box;
    }

    #node-config-tab-diagnostics,
    #node-config-tab-benchmark {
      height:100%;
      min-height:0;
      overflow-y:auto;
      overflow-x:hidden;
      padding-right:8px;
      box-sizing:border-box;
    }

    .iec104-benchmark-option {
      display:flex;
      align-items:flex-start;
      margin:12px 0;
    }

    .iec104-benchmark-option input[type="checkbox"] {
      width:auto;
      margin:3px 10px 0 0;
    }

    .iec104-benchmark-option label {
      width:auto;
      margin:0;
    }

    .iec104-benchmark-option-description {
      display:block;
      margin-top:3px;
      color:#666;
      font-size:12px;
    }

    .iec104-benchmark-settings {
      margin-top:20px;
    }

    .iec104-benchmark-status {
      margin-top:20px;
      padding:10px 0;
    }

    .iec104-benchmark-status strong {
      display:inline-block;
      min-width:110px;
    }

    #node-config-benchmark-start {
      margin-top:8px;
    }

    .iec104-info-box {
      display:block;
      flex:0 0 80px;
      width:100%;
      min-width:0 !important;
      max-width:100%;
      height:80px;
      min-height:80px;
      max-height:80px;
      margin-top:8px;
      padding:7px 6px 4px;
      border-top:1px solid #000;
      background:transparent;
      color:inherit;
      font-size:13px;
      line-height:1.35;
      overflow:hidden;
      box-sizing:border-box;
      pointer-events:none;
    }

    .iec104-help-text {
      display:block;
      width:100%;
      max-width:100%;
      min-width:0 !important;
      margin:0;
      padding:0;
      overflow:hidden;
      white-space:normal !important;
      overflow-wrap:anywhere !important;
      word-break:break-word !important;
      box-sizing:border-box;
    }
  </style>

  <div class="iec104-editor-layout">
    <div class="form-row iec104-tabs-header">
      <ul id="node-config-iec104-tabs" style="min-width:400px; margin-bottom:20px;"></ul>
    </div>

    <div id="node-config-iec104-tabs-content">
      <div id="node-config-tab-settings">
        <div class="iec104-settings-scroll">
          <div class="form-row">
            <label for="node-config-input-name">Name</label>
            <input type="text" id="node-config-input-name" placeholder="Name">
          </div>

          <hr>
          <u><h4>TCP</h4></u>

          <div class="form-row">
            <label for="node-config-input-host">Host</label>
            <input type="text" id="node-config-input-host" placeholder="127.0.0.1">
          </div>

          <div class="form-row">
            <label for="node-config-input-port">Port</label>
            <input type="number" id="node-config-input-port" placeholder="2404">
          </div>

          <div class="form-row">
            <label for="node-config-input-reconnectDelay">Wartezeit</label>
            <input type="number" id="node-config-input-reconnectDelay" min="0" style="width:80px;">
            <span style="margin-left:6px;">Sekunden</span>
          </div>

          <div class="form-row">
            <label for="node-config-input-maxRetries">Versuche</label>
            <input type="number" id="node-config-input-maxRetries" min="-1" style="width:80px;">
            <span style="margin-left:6px;">-1 = unbegrenzt</span>
          </div>

          <hr>
          <u><h4>General Interrogation</h4></u>

          <div class="form-row">
            <label for="node-config-input-autoGI">Auto GI</label>
            <input type="checkbox" id="node-config-input-autoGI" style="display:inline-block; width:auto; vertical-align:top;">
          </div>

          <div class="form-row">
            <label for="node-config-input-gi_ca">GI CA</label>
            <input type="number" id="node-config-input-gi_ca" style="width:120px;">
            <span style="margin-left:6px;">65535 = Broadcast</span>
          </div>

          <hr>
          <u><h4>Timer</h4></u>

          <div class="form-row">
            <label for="node-config-input-t0" class="iec104-help-label" tabindex="0"
                   data-info="T0 ist die Überwachungszeit für den Aufbau der Netzwerkverbindung zum Server.">T0</label>
            <input type="number" id="node-config-input-t0" style="width:80px;">
            <span style="margin-left:6px;">Sekunden</span>
          </div>

          <div class="form-row">
            <label for="node-config-input-t1" class="iec104-help-label" tabindex="0"
                   data-info="Der Parameter T1 bestimmt die Zeitüberwachung für gesendete APDU oder Test-APDU. Der Wert sollte größer als Parameter T2 eingestellt werden.">T1</label>
            <input type="number" id="node-config-input-t1" style="width:80px;">
            <span style="margin-left:6px;">Sekunden</span>
          </div>

          <div class="form-row">
            <label for="node-config-input-t2" class="iec104-help-label" tabindex="0"
                   data-info="Der Parameter T2 bestimmt die Zeit, nach der Datentelegramme spätestens quittiert werden, falls keine unmittelbaren Folgetelegramme übertragen werden und die Differenz von Parameter K noch nicht erreicht ist. Der Wert sollte kleiner als T1 eingestellt werden.">T2</label>
            <input type="number" id="node-config-input-t2" style="width:80px;">
            <span style="margin-left:6px;">Sekunden</span>
          </div>

          <div class="form-row">
            <label for="node-config-input-t3" class="iec104-help-label" tabindex="0"
                   data-info="Der Parameter T3 bestimmt die Zeit, nach der und in welchem Intervall bei Verbindungsaktivität Testtelegramme zur Verbindungsüberprüfung gesendet werden.">T3</label>
            <input type="number" id="node-config-input-t3" style="width:80px;">
            <span style="margin-left:6px;">Sekunden</span>
          </div>

          <hr>
          <u><h4>Fensterparameter</h4></u>

          <div class="form-row">
            <label for="node-config-input-k_win" class="iec104-help-label" tabindex="0"
                   data-info="Der Parameter K bestimmt die maximal auftretende Differenz zwischen empfangenen und versendeten Telegrammen, die ohne Quittierung der Gegenstelle auftreten darf.&#10;Wenn der Wert erreicht wird, so werden keine weiteren Telegramme versendet und es wird auf eine Quittierung gewartet.">K</label>
            <input type="number" id="node-config-input-k_win" placeholder="k" min="1" style="width:80px;">
          </div>

          <div class="form-row">
            <label for="node-config-input-w_win" class="iec104-help-label" tabindex="0"
                   data-info="Der Empfänger sendet spätestens nach einer Anzahl von W empfangenen Telegrammen eine Quittierung.">W</label>
            <input type="number" id="node-config-input-w_win" placeholder="w" min="1" style="width:80px;">
          </div>
        </div>

        <div id="node-config-iec104-info" class="iec104-info-box" role="status" aria-live="polite">
          <span class="iec104-help-text"></span>
        </div>
      </div>
<!-- Diagnostics tab -->
    <div id="node-config-tab-diagnostics">
      <u><h4><span data-i18n="iec104.diag.label.h-conn"></span></h4></u>

      <table class="iec104-diag-table">
        <tbody>
          <tr>
            <td><span data-i18n="iec104.diag.label.status"></span></td>
            <td id="node-config-status" style="font-weight:bold;">UNKNOWN</td>
          </tr>
          <tr>
            <td><span data-i18n="iec104.diag.label.reason"></span></td>
            <td id="node-config-reason" style="color:#666;">-</td>
          </tr>
          <tr>
            <td><span data-i18n="iec104.diag.label.conn-since"></span></td>
            <td id="node-config-connected-since">-</td>
          </tr>
          <tr>
            <td><span data-i18n="iec104.diag.label.last-rcv"></span></td>
            <td id="node-config-last-rx">-</td>
          </tr>
          <tr>
            <td><span data-i18n="iec104.diag.label.last-send"></span></td>
            <td id="node-config-last-tx">-</td>
          </tr>
          <tr>
            <td><span data-i18n="iec104.diag.label.last-frame"></span></td>

    <!-- ======================================

         ====================================== -->

    <div id="node-config-tab-benchmark">

      <u><h4>Benchmark-Messungen</h4></u>

      <p style="color:#666; margin-bottom:16px;">
        Die Auswahl der Benchmark-Metriken und die Messdauer werden
        beim Deploy übernommen. Ein Messlauf startet anschließend
        ausschließlich über die Schaltfläche "Benchmark starten".
        Nach einer automatisch erkannten Aufwärmphase wird für die
        konfigurierte Dauer gemessen. Das finale Ergebnis enthält
        sowohl die Warm-up-Daten als auch die Messdaten und wird über
        den IEC-104-Statuskanal ausgegeben.
      </p>

      <div class="iec104-benchmark-option">
        <input
          type="checkbox"
          id="node-config-input-benchmark_outbound">

        <label for="node-config-input-benchmark_outbound">
          <strong>Outbound Command</strong>
          <span class="iec104-benchmark-option-description">
            Node-RED Input → Validierung → ASDU → Send Queue →
            APCI → TCP Send
          </span>
        </label>
      </div>

      <div class="iec104-benchmark-option">
        <input
          type="checkbox"
          id="node-config-input-benchmark_inbound_report">

        <label for="node-config-input-benchmark_inbound_report">
          <strong>Inbound Report</strong>
          <span class="iec104-benchmark-option-description">
            Vollständige IEC-104 APDU → Frame-Verarbeitung →
            ASDU-Parsing → Verarbeitung der enthaltenen Prozessdaten
            abgeschlossen
          </span>
        </label>
      </div>

      <hr>

      <div class="form-row iec104-benchmark-settings">
        <label for="node-config-input-benchmark_measurement_duration">
          Messdauer
        </label>

        <input
          type="number"
          id="node-config-input-benchmark_measurement_duration"
          min="1"
          step="1"
          style="width:140px;">

        <span style="margin-left:6px;">
          Sekunden
        </span>
      </div>

      <div style="color:#666; font-size:12px; margin-top:6px;">
        Die Nachrichtenfrequenz wird nicht durch den Benchmark gesteuert.
        Die Warm-up-Erkennung verwendet ein gleitendes Fenster von
        10 Durchsatzwerten und eine maximale relative Spannweite von 5 %.
      </div>

      <hr>

      <div class="iec104-benchmark-status">
        <div>
          <strong>Status</strong>
          <span id="node-config-benchmark-phase">Bereit</span>
        </div>

        <div style="margin-top:4px;">
          <strong>Fortschritt</strong>
          <span id="node-config-benchmark-progress">-</span>
        </div>

        <button
          type="button"
          class="red-ui-button"
          id="node-config-benchmark-start">
          Benchmark starten
        </button>
      </div>

    </div>

    </div>
