<script src="resources/node-red-contrib-iec104/iec104-editor.js"></script>

<script type="text/javascript">
RED.nodes.registerType("iec104-measuredvalue", {
    category: "IEC 104",
    color: "#dce5f5",

    defaults: {
        name: { value: "" },

        ioaFromMsg: { value: false },
        ioa0: { value: 0, validate: window.iec104Editor.byteValidator },
        ioa1: { value: 0, validate: window.iec104Editor.byteValidator },
        ioa2: { value: 0, validate: window.iec104Editor.byteValidator },

        meType: { value: "M_ME_NC_1" },
        tsSource: { value: "now" },

        qInvalidMode: { value: "msg" },
        qSubstitutedMode: { value: "msg" },
        qBlockedMode: { value: "msg" },
        qNotTopicalMode: { value: "msg" },
        qOverflowMode: { value: "msg" }
    },

    inputs: 1,
    outputs: 1,
    icon: "serial.svg",

    paletteLabel: function () {
        return this._("iec104.paletteLabel");
    },

    label: function () {
        return window.iec104Editor.labelWithIoa(
            this,
            this._("iec104.label")
        );
    },

    oneditprepare: function () {
        window.iec104Editor.initIoaEditor();
    }
});
</script>

<script type="text/html" data-template-name="iec104-measuredvalue">

  <div class="form-row">
    <label for="node-input-name"><i class="fa fa-tag"></i>Name</label>
    <input type="text" id="node-input-name">
  </div>

   <div class="ioa-input">
    <div class="form-row">
      <label><span data-i18n="iec104.settings.general.label-ioa"></span></label>
      <input type="number" id="node-input-ioa0" min="0" max="255" placeholder="b0" style="width:60px; margin-right:5px;">
      <input type="number" id="node-input-ioa1" min="0" max="255" placeholder="b1" style="width:60px; margin-right:5px;">
      <input type="number" id="node-input-ioa2" min="0" max="255" placeholder="b2" style="width:60px;">
    </div>
    <div class="form-row">
      <label>&nbsp;</label>
      <input type="checkbox"
            id="node-input-ioaFromMsg"
            style="display:inline-block; width:auto; vertical-align:top;">
            
      <label for="node-input-ioaFromMsg"
            style="width:70%;">
            <span data-i18n="iec104.settings.general.label-ioa-box"></span>
      </label>
    </div>
    <div class="form-row">
      <div id="node-ioa-preview" class="form-tips" style="width:auto;">
        IOA: 0 | Hex: 0x000000
      </div>
    </div>
  </div>

  <div class="form-row">
    <label for="node-input-meType"><span data-i18n="iec104.settings.type"></label>
    <select id="node-input-meType">
      <option value="M_ME_NB_1">M_ME_NB_1 (scaled, ohne Zeit)</option>
      <option value="M_ME_NC_1">M_ME_NC_1 (float, ohne Zeit)</option>
      <option value="M_ME_TE_1">M_ME_TE_1 (scaled, CP56Time2a)</option>
      <option value="M_ME_TF_1">M_ME_TF_1 (float, CP56Time2a)</option>
    </select>
  </div>

  <div class="form-row row-ts">
    <label for="node-input-tsSource"><span data-i18n="iec104.settings.time"></label>
    <select id="node-input-tsSource">
      <option value="now"><span data-i18n="iec104.settings.time-now"></option>
      <option value="msg"><span data-i18n="iec104.settings.time-msg"></option>
    </select>
  </div>

  <hr>

  <div class="form-row">
    <label><span data-i18n="iec104.settings.qds.label"></span></label>
  </div>
  <div class="qds-settings">
    <div class="form-row">
      <label for="node-input-qInvalidMode" style="width:120px; white-space:nowrap;"><span data-i18n="iec104.settings.qds.opts.label-iv"></label>
      <select id="node-input-qInvalidMode">
        <option value="msg"><span data-i18n="iec104.settings.qds.opts.select-iv"></option>
        <option value="false">false</option>
        <option value="true">true</option>
      </select>
    </div>

    <div class="form-row">
      <label for="node-input-qSubstitutedMode" style="width:120px; white-space:nowrap;"><span data-i18n="iec104.settings.qds.opts.label-sb"></label>
      <select id="node-input-qSubstitutedMode">
        <option value="msg"><span data-i18n="iec104.settings.qds.opts.select-sb"></option>
        <option value="false">false</option>
        <option value="true">true</option>
      </select>
    </div>

    <div class="form-row">
      <label for="node-input-qBlockedMode" style="width:120px; white-space:nowrap;"><span data-i18n="iec104.settings.qds.opts.label-bl"></label>
      <select id="node-input-qBlockedMode">
        <option value="msg"><span data-i18n="iec104.settings.qds.opts.select-bl"></option>
        <option value="false">false</option>
        <option value="true">true</option>
      </select>
    </div>

   <div class="form-row">
      <label for="node-input-qNotTopicalMode" style="width:120px; white-space:nowrap;"><span data-i18n="iec104.settings.qds.opts.label-nt"></label>
      <select id="node-input-qNotTopicalMode">
        <option value="msg"><span data-i18n="iec104.settings.qds.opts.select-nt"></option>
        <option value="false">false</option>
        <option value="true">true</option>
      </select>
    </div>
    <div class="form-row">
      <label for="node-input-qOverflowMode" style="width:120px; white-space:nowrap;"><span data-i18n="iec104.settings.qds.opts.label-ov"></label>
      <select id="node-input-qOverflowMode">
        <option value="msg"><span data-i18n="iec104.settings.qds.opts.select-ov"></option>
        <option value="false">false</option>
        <option value="true">true</option>
      </select>
    </div>
  </div>
</script>
