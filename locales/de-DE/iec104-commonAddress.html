<script type="text/html" data-help-name="iec104-station">
  <p>Diese Node definiert eine Stationsadresse. Sie ergänzt eingehende Nachrichten um diese Adresse und leitet sie an ein IEC 60870-5-104 Gateway weiter</p>

  <h3>Einstellungen</h3>
  <dl>
    <dt>Stationsadresse (CA)</dt>
    <dd>
       Die Adresse wird aus zwei Oktetten (Big Endian) gebildet
    </dd>
    <dt>Gateway</dt>
    <dd>Verknüpftes Gateway, an das die Nachricht weitergeleitet wird</dd>
  </dl>
  <h3>Beispiel</h3>
<pre>
<b>Eingang</b>
msg.payload = { value: 42 }

<b>Konfiguration</b>
Hi = 0, Lo = 1

<b>Ergebnis</b>
msg.payload = { value: 42, ca: 1}
</pre>
  <h3>Hinweise</h3>
  <ul>
    <li>Die Weiterleitung erfolgt über das Event(<code>iec104:input</code>)</li>
  </ul>
</script>
