<script type="text/html" data-help-name="iec104-observer">

  <p>
    This node monitors an IEC 60870-5-104 slave and forwards received data
    and status events to its outputs.
  </p>

  <h3>Functionality</h3>
  <p>
    The node listens to slave events and reacts to incoming data and status messages
    <code>iec104:data</code> and <code>iec104:status</code>.
    These are sent to different outputs.
  </p>

  <h3>Outputs</h3>
  <dl>
    <dt>1st Output (Data)</dt>
    <dd>
      Forwards received telegrams (<code>iec104:data</code>).
    </dd>

    <dt>2nd Output (Status)</dt>
    <dd>
      Forwards status messages (<code>iec104:status</code>), e.g. connection states.
    </dd>
  </dl>

  <h3>Configuration</h3>
  <dl>

    <dt>IEC 60870-5-104 Slave</dt>
    <dd>
      Linked slave from which data and status are received
    </dd>
  </dl>

  <h3>Example</h3>
  <pre>
    Slave sends:
    Event: iec104:data
    msg.payload = { value: 42 }

    → Output 1:
    msg.payload = { value: 42 }

    Event: iec104:status
    msg.payload = { state: DATA_TRANSFER }

    → Output 2:
    msg.payload = { state: DATA_TRANSFER }
  </pre>

</script>
