<script type="text/javascript">
RED.nodes.registerType('iec104-slave',{
  category: 'config',
  defaults: {
    name: {value: ''},
    port: {value: 2404, required: true, validate: RED.validators.number()},
    t1: { value: 15, required: true, validate: RED.validators.number()},
    t2: { value: 10, required: true, validate: RED.validators.number()},
    t3: { value: 20, required: true, validate: RED.validators.number()},
    k_win: { value: 12, required: true, validate: RED.validators.number()},
    w_win: { value: 8, required: true, validate: RED.validators.number()}
  },
  label: function() {
    return this.name || "IEC 60870-5-104 Slave";
  },
  paletteLabel: "IEC 60870-5-104 Slave",

  oneditprepare: function () {
    const nodeId = this.id;
    // Preserve the node-specific translation function for use in renderStatus().
    const _ = this._.bind(this);
    let es = null;

    const tabs = RED.tabs.create({
      id: "node-config-iec104-tabs",
      onchange: function(tab) {
        $("#node-config-iec104-tabs-content").children().hide();
        $("#" + tab.id).show();
      }
    });

    tabs.addTab({
      id: "node-config-tab-settings",
      label: this._("iec104.settings.tab-name")
    });

    tabs.addTab({
      id: "node-config-tab-diagnostics",
      label: this._("iec104.diag.tab-name")
    });

    $("#node-config-iec104-tabs-content").children().hide();
    $("#node-config-tab-settings").show();

    const colors = {
      IDLE: "#666",
      CONNECTED: "#d98c00",
      DATA_TRANSFER: "green",
      STOPPED: "#1d6fd1",
      DISCONNECTED: "red",
      UNKNOWN: "#999"
    };

    function fmtTs(ts) {
      if (!ts) return "-";
      return new Date(ts).toLocaleTimeString();
    }

    function yesNo(v) {
      return v ? "yes" : "no";
    }

    function renderStatus(data) {
      const state = data?.state || "UNKNOWN";
      const raw = data?.reason || "";
      const translated = _(raw);

      const color = colors[state] || colors.UNKNOWN;

      $("#node-config-status").text(state).css("color", color);
      $("#node-config-reason").text(translated === raw ? raw : translated);

      const session = data?.session;
      const a = session?.apci;
      const stats = session?.stats;
      const timers = session?.timers;
      const gi = session?.gi;

      if (a) {
        $("#node-config-apci-sendseq").text(a.sendSeq);
        $("#node-config-apci-recvseq").text(a.recvSeq);
        $("#node-config-apci-ackseq").text(a.ackSeq);
        $("#node-config-apci-window").text(`${a.unconfirmed}/${a.k}`);
        $("#node-config-apci-ackpending").text(`${a.recvSinceLastAck}/${a.w}`);;
      } else {
        $("#node-config-apci-sendseq").text("-");
        $("#node-config-apci-recvseq").text("-");
        $("#node-config-apci-ackseq").text("-");
        $("#node-config-apci-window").text("-");
        $("#node-config-apci-ackpending").text("-");
      }

      if (stats) {
        $("#node-config-frame-itx").text(stats.iTx ?? "-");
        $("#node-config-frame-irx").text(stats.iRx ?? "-");
        $("#node-config-frame-stx").text(stats.sTx ?? "-");
        $("#node-config-frame-srx").text(stats.sRx ?? "-");
        $("#node-config-frame-utx").text(stats.uTx ?? "-");
        $("#node-config-frame-urx").text(stats.uRx ?? "-");
        $("#node-config-gi-count").text(stats.giCount ?? "-");
        $("#node-config-last-rx").text(fmtTs(stats.lastRxAt));
        $("#node-config-last-tx").text(fmtTs(stats.lastTxAt));
        $("#node-config-last-frame").text(stats.lastFrameType || "-");
        $("#node-config-connected-since").text(fmtTs(stats.connectionStartedAt));
      } else {
        $("#node-config-frame-itx").text("-");
        $("#node-config-frame-irx").text("-");
        $("#node-config-frame-stx").text("-");
        $("#node-config-frame-srx").text("-");
        $("#node-config-frame-utx").text("-");
        $("#node-config-frame-urx").text("-");
        $("#node-config-gi-count").text("-");
        $("#node-config-last-rx").text("-");
        $("#node-config-last-tx").text("-");
        $("#node-config-last-frame").text("-");
        $("#node-config-connected-since").text("-");
      }

      if (timers) {
        $("#node-config-await-testcon").text(yesNo(timers.awaitingTestCon));
      } else {
        $("#node-config-await-testcon").text("-");
      }

      if (gi) {
        $("#node-config-gi-active").text(yesNo(gi.active));
        $("#node-config-gi-cas").text((gi.cas && gi.cas.length) ? gi.cas.join(", ") : "-");
      } else {
        $("#node-config-gi-active").text("-");
        $("#node-config-gi-cas").text("-");
      }
    }

    $.getJSON("iec104/" + nodeId + "/status")
      .done(renderStatus)
      .fail(function () {
        renderStatus({ state: "UNKNOWN", reason: "keine Verbindung", session: null });
      });

    es = new EventSource("iec104/" + nodeId + "/events");

    es.addEventListener("status", function (evt) {
      try {
        renderStatus(JSON.parse(evt.data));
      } catch (err) {
        console.warn("IEC104 status parse error", err);
      }
    });

    es.onerror = function () {
      renderStatus({
        state: "DISCONNECTED",
        reason: "Status-Stream getrennt",
        session: null
      });
    };

    this._iec104EventSource = es;
  },

  oneditcancel: function () {
    if (this._iec104EventSource) {
      this._iec104EventSource.close();
      this._iec104EventSource = null;
    }
  },

  oneditsave: function () {
    if (this._iec104EventSource) {
      this._iec104EventSource.close();
      this._iec104EventSource = null;
    }
  }
});
</script>

<script type="text/html" data-template-name="iec104-slave">
  <style>
    .iec104-diag-table {
      width: 80%;
      border-collapse: collapse;
    }

    .iec104-diag-table td {
      padding: 4px 0;
      vertical-align: top;
    }

    .iec104-diag-table td:first-child {
      width: 240px;
      padding-right: 24px;
    }

    .iec104-diag-table td:last-child {
      text-align: left;
      white-space: nowrap;
    }

    .iec104-diag-table.iec104-diag-values-right td:last-child {
      text-align: right;
    }

    .iec104-diag-frame-table th,
    .iec104-diag-frame-table td {
        padding: 4px 0;
    }

    .iec104-diag-frame-table th:first-child,
    .iec104-diag-frame-table td:first-child {

    }

    .iec104-diag-frame-table td:nth-child(2) {
        width: 70px;

    .iec104-diag-frame-table td:nth-child(3) {

        text-align: right;
    }

      <div class="form-row">
        <label for="node-config-input-name">Name</label>
        <input type="text" id="node-config-input-name">
      </div>


      <div class="form-row">
        <label for="node-config-input-port">Port</label>
        <input type="number" id="node-config-input-port">
      </div>

      <div class="form-row">
        <label for="node-config-input-t1">T1</label>
        <input type="number" id="node-config-input-t1" style="width:80px;">
        <span style="margin-left:6px;">Sekunden</span>
      </div>

      <div class="form-row">
        <label for="node-config-input-t1">T2</label>
        <input type="number" id="node-config-input-t2" style="width:80px;">
        <span style="margin-left:6px;">Sekunden</span>
      </div>

      <div class="form-row">
        <label for="node-config-input-t3">T3</label>

        <span style="margin-left:6px;">Sekunden</span>

      <div class="form-row">
        <label>k/w</label>
        <input type="number" id="node-config-input-k_win" placeholder="k" style="width:80px; margin-right:5px;">
        <input type="number" id="node-config-input-w_win" placeholder="w" style="width:80px;">
      </div>

    </div>
    <!-- Diagnostics tab -->
    <div id="node-config-tab-diagnostics">
      <u><h4><span data-i18n="iec104.diag.label.h-conn"></span></h4></u>

      <table class="iec104-diag-table">
        <tbody>
          <tr>
            <td><span data-i18n="iec104.diag.label.status"></span></td>
            <td id="node-config-status" style="font-weight:bold;">UNKNOWN</td>
          </tr>
          <tr>
            <td><span data-i18n="iec104.diag.label.reason"></span></td>
            <td id="node-config-reason" style="color:#666;">-</td>
          </tr>
          <tr>
            <td><span data-i18n="iec104.diag.label.conn-since"></span></td>
            <td id="node-config-connected-since">-</td>
          </tr>
          <tr>
            <td><span data-i18n="iec104.diag.label.last-rcv"></span></td>
            <td id="node-config-last-rx">-</td>
          </tr>
          <tr>
            <td><span data-i18n="iec104.diag.label.last-send"></span></td>
            <td id="node-config-last-tx">-</td>
          </tr>
          <tr>
            <td><span data-i18n="iec104.diag.label.last-frame"></span></td>
            <td id="node-config-last-frame">-</td>
          </tr>
          <tr>
            <td style="padding:4px 0;">Verbindungstest aktiv</td>
            <td id="node-config-await-testcon">-</td>
          </tr>
        </tbody>
      </table>

      <hr>
      <u><h4><span data-i18n="iec104.diag.label.h-apci"></span></h4></u>

      <table class="iec104-diag-table iec104-diag-values-right">
        <tbody>
          <tr>
            <td style="padding:4px 0;">Sendefolgenummer N(S)</td>
            <td id="node-config-apci-sendseq" style="text-align:right;">-</td>
          </tr>

          <tr>
            <td style="padding:4px 0;">Empfangsfolgenummer N(R)</td>
            <td id="node-config-apci-recvseq" style="text-align:right;">-</td>
          </tr>

          <tr>
            <td style="padding:4px 0;">Bestätigt bis</td>
            <td id="node-config-apci-ackseq" style="text-align:right;">-</td>
          </tr>

          <tr>
            <td style="padding:4px 0;">Unbestätigt gesendet</td>
            <td id="node-config-apci-window" style="text-align:right;">-</td>
          </tr>

          <tr>
            <td style="padding:4px 0;">Unquittiert empfangen</td>
            <td id="node-config-apci-ackpending" style="text-align:right;">-</td>
          </tr>
        </tbody>
      </table>

      <hr>
      <u><h4><span data-i18n="iec104.diag.label.h-counters"></span></h4></u>

      <table class="iec104-diag-table iec104-diag-values-right iec104-diag-frame-table">
          <thead>
              <tr>
                  <th></th>
                  <th>Gesendet</th>
                  <th>Empfangen</th>
              </tr>
          </thead>
          <tbody>
              <tr>
                  <td>I-Frames</td>
                  <td id="node-config-frame-itx">-</td>
                  <td id="node-config-frame-irx">-</td>
              </tr>

              <tr>
                  <td>S-Frames</td>
                  <td id="node-config-frame-stx">-</td>
                  <td id="node-config-frame-srx">-</td>
              </tr>

              <tr>
                  <td>U-Frames</td>
                  <td id="node-config-frame-utx">-</td>
                  <td id="node-config-frame-urx">-</td>
              </tr>
          </tbody>
      </table>

      <hr>
      <u><h4><span data-i18n="iec104.diag.label.h-gi"></span></h4></u>

      <table class="iec104-diag-table iec104-diag-values-right">
        <tbody>

          <tr>
            <td style="padding:4px 0;">Anzahl Abfragen</td>
            <td id="node-config-gi-count">-</td>
          </tr>

          <tr>
            <td style="padding:4px 0;">Aktiv</td>
            <td id="node-config-gi-active">-</td>
          </tr>

          <tr>
            <td style="padding:4px 0;">Aktive Stationsadressen</td>
            <td id="node-config-gi-cas">-</td>
          </tr>

        </tbody>
      </table>
    </div>

  </div>

</script>
